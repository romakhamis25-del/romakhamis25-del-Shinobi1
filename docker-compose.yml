version: "3.9"
services:
  shinobi:
    build: .
    volumes:
      - ./config.json:/app/config.json
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - AI_ENDPOINT=http://ollama:11434/v1
      - AI_MODEL=llama3.1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on: [ollama]
    cap_add:
      - NET_RAW

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
